[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rawQC"
version = "0.1.1"
description = "ID-free QC metrics demo refactored into a reusable package"
readme = "README.MD"
requires-python = ">=3.9"
dependencies = [
    "click",
    "pymzqc>=1.0.1",
    "pyopenms>=3.4.0",
    "seaborn>=0.13.2",
]

[project.scripts]
rawQC = "rawQC.calculate_metrics:main"

